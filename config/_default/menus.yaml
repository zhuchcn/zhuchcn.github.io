# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /#about
    weight: 10
  - name: Research
    url: /#research
    weight: 30
  - name: Experience
    url: /#experience
    weight: 20
  - name: Publications
    url: /#publications
    weight: 40
  - name: Contact
    url: /#contact
    weight: 50

footer:
  - name: Privacy
    url: /privacy/
    weight: 10
  - name: Terms
    url: /terms/
    weight: 20
