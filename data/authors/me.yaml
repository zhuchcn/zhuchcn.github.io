bio: |
  Chenghao Zhu is a Research Assistant Professor in the NCI-designated Cancer
  Center at Sanford Burnham Prebys. His research focuses on developing
  computational methods and software for proteogenomics and applying
  proteogenomics to cancer diagnosis, prognosis, and clinico-epidemiologic
  questions.

